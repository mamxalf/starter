name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # One source of truth (.nvmrc, same as mise.toml). `22` let the runner pick an older cached
          # 22.x, and astro requires >=22.23.4.
          node-version-file: .nvmrc
          cache: pnpm
      - name: Create non-superuser app role (RLS must apply in tests)
        run: psql postgres://postgres:postgres@localhost:5432/postgres -f docker/postgres/init.sql
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:boundaries
      - run: pnpm turbo run typecheck test build
