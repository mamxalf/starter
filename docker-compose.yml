# Local development services. The apps themselves run on the host via `pnpm dev`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI: http://localhost:8025

  storage:
    # Any S3-compatible server works. Pinned MinIO release for local dev only.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - storage:/data

  storage-init:
    # Creates the dev bucket once storage is up.
    image: minio/mc:latest
    depends_on: [storage]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://storage:9000 minio minio12345; do sleep 1; done;
      mc mb --ignore-existing local/app"

volumes:
  pgdata:
  storage:
